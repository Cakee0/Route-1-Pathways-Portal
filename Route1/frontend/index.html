<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Route 1 Pathways — Minnesota Food Rescue Marketplace</title>

  <!-- Search & link previews -->
  <meta name="description"
    content="Route 1 Pathways connects Minnesota farmers, food shelves, and neighbors so surplus crops feed people — not landfills. Free for farmers, food shelves, and neighbors." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Route 1 Pathways" />
  <meta property="og:title" content="Route 1 Pathways — Minnesota Food Rescue Marketplace" />
  <meta property="og:description"
    content="Good food shouldn't go to waste. Route 1 connects Minnesota farmers, food shelves, and neighbors so surplus crops feed people — not landfills." />
  <meta property="og:url" content="https://route1pathways.app/" />
  <meta name="theme-color" content="#1f3d2e" />

  <!-- Type: Zilla Slab (agrarian display) · Public Sans (civic body) · IBM Plex Mono (ledger data) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="styles.css?v=20260722c" />

  <!-- Google Identity Services (Sign in with Google) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

  <!-- Keyboard users jump straight past the header -->
  <a class="skip-link" href="#app">Skip to content</a>

  <!-- ── Sticky header (populated by app.js after auth state is known) ── -->
  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-icon">🌾</span>
        <div class="brand-text">
          <span class="brand-name">Route&nbsp;<strong>1</strong></span>
          <span class="brand-sub">Pathways</span>
        </div>
      </div>
    </div>
  </header>

  <!-- ── SPA mount point ────────────────────────────────────────────────── -->
  <main class="main-content" id="app">
    <!-- Content injected here by app.js via navigate() -->
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Loading Route 1 Pathways…</p>
    </div>
  </main>

  <!-- ── Site footer (hidden on the landing page, which ships its own) ───── -->
  <footer class="site-footer landing-footer">
    <span class="landing-foot-brand">Route <strong>1</strong> Pathways</span>
    <nav class="landing-foot-links" aria-label="Footer">
      <a href="#/about">About us</a>
      <a href="#/contact">Contact</a>
    </nav>
    <span class="landing-foot-tag">A Minnesota food rescue marketplace</span>
  </footer>

  <!-- ── Toast notification ─────────────────────────────────────────────── -->
  <div id="toast" class="toast-hide" role="alert" aria-live="polite"></div>

  <!-- ── Analytics (GoatCounter — privacy-friendly, no cookies) ────────────
       no_onload: this is an SPA, so pageviews are counted manually in
       App.navigate() / App._track() instead of once per full page load. -->
  <script>window.goatcounter = { no_onload: true };</script>
  <script data-goatcounter="https://route1pathways.goatcounter.com/count"
          async src="https://gc.zgo.at/count.js"></script>

  <!-- ── SPA logic ──────────────────────────────────────────────────────── -->
  <script src="app.js?v=20260722c"></script>
</body>

</html>
